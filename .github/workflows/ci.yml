name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Suite completa sobre SQLite (como en desarrollo). Incluye las pruebas marcadas solo_sqlite.
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Misma suite sobre PostgreSQL 18 (TEST_DATABASE_URL). Se omiten SOLO las pruebas marcadas solo_sqlite
  # (dependen de que DATABASE_URL sea un archivo SQLite); el reporte las muestra como "skipped".
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sql_adaptativo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Clientes de PostgreSQL 18 (pg_dump/pg_restore para las pruebas de respaldo)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - run: pip install -r requirements-dev.txt
      - name: Migraciones sobre PostgreSQL vacío (upgrade head + alembic check)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sql_adaptativo_migraciones
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE sql_adaptativo_migraciones"
          alembic upgrade head
          alembic check
      - name: Pruebas contra PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sql_adaptativo_test
        run: pytest -m "not solo_sqlite"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
